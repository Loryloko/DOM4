<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container text-center mt-5">
        <div class="row justify-content-center mb-3">
        <div class="col-12 col-md-6">
            <input type="number" id="inputSecondi" placeholder="Inserisci un numero" class="form-control text-center"></input>
        </div>
        </div>
        <div class="row justify-content-center g-2">
            <div class="col-4 col-md-2">
                <button id="CD" class="btn btn-primary w-100">Start</button>
            </div>
            <div class="col-4 col-md-2">
                <button id="Pausa" class="btn btn-warning w-100">Pausa</button>
            </div>
            <div class="col-4 col-md-2">
                <button id="Reset" class="btn btn-danger w-100">Reset</button>
            </div>
        </div>
        <div class="row justify-content-center mt-4">
            <div class="col-12 text-center">
                <h2 id="timerDisplay" class="display-4">0</h2>
            </div>
        </div>
    </div>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
